{% extends "base.html" %}

{% block content %}
<div class="card auth-card">
  <h1>Sign in</h1>
  <p class="muted u-text-sm u-mb-5">Welcome back.</p>

  {% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}
  {% if success %}<div class="notice notice--success" role="status">{{ success }}</div>{% endif %}

  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="field">
      <label for="email">Email</label>
      <input class="input" type="email" id="email" name="email" value="{{ email or '' }}"
             required autocomplete="email" autofocus>
    </div>

    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="/forgot-password" class="label-row__aside">Forgot?</a>
      </div>
      <input class="input" type="password" id="password" name="password"
             required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn--primary btn--block">Sign in</button>
  </form>

  <p class="auth-card__foot">
    No account yet? <a href="/signup">Create one free</a>
  </p>
</div>
{% endblock %}
