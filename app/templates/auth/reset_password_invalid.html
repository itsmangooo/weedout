{% extends "base.html" %}

{% block content %}
<div class="card auth-card" style="text-align:center">
  <h1>That link has expired</h1>
  <p class="muted">
    Reset links work once and last an hour. This one has already been used, run
    out, or was replaced by a newer request.
  </p>
  <div class="btn-row" style="justify-content:center;margin-top:1.5rem">
    <a href="/forgot-password" class="btn btn--primary">Request a new link</a>
    <a href="/login" class="btn btn--ghost">Back to sign in</a>
  </div>
</div>
{% endblock %}
