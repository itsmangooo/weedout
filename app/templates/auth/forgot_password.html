{% extends "base.html" %}

{% block content %}
<div class="card auth-card">
  <h1>Reset your password</h1>
  <p class="muted" style="font-size:0.875rem;margin-bottom:1.5rem">
    Enter the address you signed up with and we'll email you a link to choose a
    new password.
  </p>

  {% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/forgot-password" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="field">
      <label for="email">Email</label>
      <input class="input" type="email" id="email" name="email" value="{{ email or '' }}"
             required autocomplete="email" autofocus>
    </div>

    <button type="submit" class="btn btn--primary btn--block">Email me a link</button>
  </form>

  <p class="auth-card__foot">
    Remembered it? <a href="/login">Sign in</a>
  </p>
</div>
{% endblock %}
