# Full local stack: Postgres + web + a dedicated background worker.
#
#   docker compose up --build
#
# The web container waits for Postgres to pass its healthcheck, runs
# `alembic upgrade head`, then serves on:
#
#   http://localhost:8000
#
# This file is intended for LOCAL development.
# Production uses docker-compose.prod.yaml behind Coolify / Traefik.

name: weedout

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: weedout
      POSTGRES_PASSWORD: weedout
      POSTGRES_DB: weedout

    ports:
      # Local development only.
      # Override if port 5432 is already occupied:
      #
      #   POSTGRES_PORT=5433 docker compose up
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U weedout -d weedout
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      sh -c "alembic upgrade head &&
             python -m app"

    environment:
      DATABASE_URL: postgresql+psycopg://weedout:weedout@db:5432/weedout

      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-me-please}

      ENVIRONMENT: local

      BASE_URL: http://localhost:8000

      EMAIL_BACKEND: console

      # The worker owns scheduled jobs.
      RUN_SCHEDULER_IN_WEB: "false"

      LOG_FORMAT: console

    # Local development:
    #
    # host :8000
    #     ↓
    # container :8000
    #
    # The Python app must bind to 0.0.0.0:8000 inside the container.
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: python -m app.jobs.runner loop

    # The Dockerfile healthcheck probes /healthz on port 8000.
    # The worker does not serve HTTP, so inheriting that healthcheck would
    # incorrectly mark the worker as unhealthy.
    healthcheck:
      disable: true

    environment:
      DATABASE_URL: postgresql+psycopg://weedout:weedout@db:5432/weedout

      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-me-please}

      ENVIRONMENT: local

      BASE_URL: http://localhost:8000

      EMAIL_BACKEND: console

      LOG_FORMAT: console

    depends_on:
      db:
        condition: service_healthy

      web:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Local mail catcher
  # ---------------------------------------------------------------------------
  #   docker compose --profile mail up
  #
  # Behind a profile so a plain `docker compose up` is unchanged. Start it when
  # you need to look at an email, then point the app at it:
  #
  #   EMAIL_BACKEND=smtp
  #   SMTP_HOST=mailpit
  #   SMTP_PORT=1025
  #   SMTP_USE_TLS=false
  #
  # Read what was "sent" at http://localhost:8025 — nothing leaves the machine.
  #
  # This is the only way to exercise the admin bootstrap locally: it refuses to
  # run with EMAIL_BACKEND=console, because that backend delivers by writing the
  # message body to the log and the generated password must never land there.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, for tools outside Compose

volumes:
  pgdata: