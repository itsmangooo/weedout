[project]
name = "weedout"
version = "0.1.0"
description = "Reachable-CVE watchlist for small dev teams. Alerts only on what is actually exploited or actually reachable."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Pure-Python QR encoder, no transitive dependencies and no C extension.
    # Emits inline SVG, which is what lets the 2FA QR render under a CSP that
    # allows no external images and no inline script.
    "segno>=1.6",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "aiosmtplib>=3.0",
    "structlog>=24.4",
    "packaging>=24.2",
    # Only ever used through `yaml.safe_load`, never `yaml.load`: the input is
    # a .weedout.yml out of somebody else's repository, and full YAML can
    # construct arbitrary Python objects. See app/core/policy.py.
    "pyyaml>=6.0",
    # `linkify` turns bare URLs in docs into links; it is an optional extra of
    # markdown-it-py and the parser raises at render time without it.
    "markdown-it-py[linkify]>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
weedout-scan = "app.jobs.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Our own deprecation warnings are bugs; everyone else's are noise.
    "error::DeprecationWarning:app.*",
    # Windows-only workaround for psycopg's event loop requirement. See
    # app.db.configure_event_loop_policy.
    "default:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning",
    "default::pytest.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E402"]
