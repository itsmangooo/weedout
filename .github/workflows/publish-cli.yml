# Publish `weedout-cli` to PyPI on a version tag.
#
# ⚠ THE FILENAME OF THIS FILE IS PART OF THE CREDENTIAL.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token
# anywhere in this repository or in its secrets. Instead, PyPI is configured to
# trust a specific workflow *by filename*, and it must match this file exactly:
#
#   PyPI → your project → Manage → Publishing → Trusted publisher
#     Owner:              itsmangooo
#     Repository:         weedout
#     Workflow name:      publish-cli.yml        ← must equal this file's name
#     Environment:        pypi                   ← must equal `environment:` below
#
# If the registered workflow name is anything else (`publish.yml`,
# `release.yml`, …), the upload fails with "not a trusted publisher" and no
# amount of retrying helps. Either rename this file to match what is registered,
# or edit the registration to match this file. Same for the environment name:
# if you registered no environment, delete the `environment:` block below,
# because a workflow that declares one PyPI does not expect is also rejected.
#
# For the very first release the project does not exist on PyPI yet, so there is
# nothing to attach a publisher to. Use a *pending* publisher instead:
#   PyPI → Account → Publishing → Add a pending publisher, with the same four
#   values above and project name `weedout-cli`.

name: Publish CLI

on:
  push:
    tags:
      - "v*"
  # Build without publishing, to check a release will work before tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The tag is the release's public name and the wheel's version is what
      # people actually install. If they disagree, either the upload is rejected
      # as a duplicate or — worse — `v0.2.0` ships a wheel that reports 0.1.0.
      # Checked before building so a mistake costs a few seconds, not a
      # yanked release.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(cd cli && python -c "import weedout_cli; print(weedout_cli.__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION package=$PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match weedout_cli.__version__ ($PACKAGE_VERSION). Bump cli/weedout_cli/__init__.py or retag."
            exit 1
          fi

      - name: Build
        run: python -m build --outdir dist cli

      # Catches a README that renders badly on PyPI, which cannot be fixed
      # after upload — a version number is only usable once.
      - name: Check metadata renders
        run: python -m twine check --strict dist/*

      # Prove the artefact is installable and the console script works before
      # it is published, in a venv with nothing else in it.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/weedout --version
          /tmp/smoke/bin/weedout --help
          echo "--- installed packages (weedout-cli must have no dependencies) ---"
          /tmp/smoke/bin/python -m pip list --format=freeze

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Tags only. A manual run builds and smoke-tests but publishes nothing,
    # so it is safe to use as a rehearsal.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Must match the environment registered on the trusted publisher, or be
    # removed if none was registered. See the note at the top of this file.
    environment:
      name: pypi
      url: https://pypi.org/p/weedout-cli

    permissions:
      # The OIDC token PyPI exchanges for a short-lived upload credential. This
      # is the whole reason no API token is needed. Scoped to this job alone —
      # the build job above cannot mint one.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
