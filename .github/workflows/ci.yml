name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weedout
          POSTGRES_PASSWORD: weedout
          POSTGRES_DB: weedout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weedout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-long-enough-to-pass-validation-check
      DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout
      WEEDOUT_TEST_DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout_test
      ENVIRONMENT: test
      EMAIL_BACKEND: console
      RUN_SCHEDULER_IN_WEB: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for schema drift
        # Fails when app/models.py changed but nobody generated a migration.
        run: alembic check

      - name: Build frontend shell for integration tests
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  production-image:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag weedout:ci .
