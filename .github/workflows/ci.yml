name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weedout
          POSTGRES_PASSWORD: weedout
          POSTGRES_DB: weedout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weedout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-long-enough-to-pass-validation-check
      DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout
      WEEDOUT_TEST_DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout_test
      ENVIRONMENT: test
      EMAIL_BACKEND: console
      RUN_SCHEDULER_IN_WEB: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for schema drift
        # Fails when app/models.py changed but nobody generated a migration.
        run: alembic check

      - name: Test
        run: pytest -q
