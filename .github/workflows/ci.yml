name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weedout
          POSTGRES_PASSWORD: weedout
          POSTGRES_DB: weedout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weedout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-long-enough-to-pass-validation-check
      DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout
      WEEDOUT_TEST_DATABASE_URL: postgresql+psycopg://weedout:weedout@localhost:5432/weedout_test
      ENVIRONMENT: test
      EMAIL_BACKEND: console
      RUN_SCHEDULER_IN_WEB: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          runner_architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: ${runner_architecture}" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          printf '%s\n' '/usr/lib/postgresql/17/bin' >>"$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend shell
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for schema drift
        # Fails when app/models.py changed but nobody generated a migration.
        run: alembic check

      - name: Build frontend shell for integration tests
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python parity reference
        run: pip install -e ".[dev]"

      - name: Test and vet Go engine
        working-directory: engine
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/weedout-engine

      - name: Verify Python to Go parity corpus
        run: python engine/parity/python_reference.py

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  vscode-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: integrations/vscode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

  jetbrains-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: integrations/jetbrains

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: ./gradlew test buildPlugin --no-daemon

  production-image:
    runs-on: ubuntu-latest
    needs: [test, frontend, engine, web, vscode-integration, jetbrains-integration]

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag weedout:ci .

      - name: Build migration service images
        run: |
          docker build --tag weedout-engine:ci engine
          docker build --tag weedout-web:ci web
